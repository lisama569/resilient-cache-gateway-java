spring.application.name=resilient-cache-gateway

# 缓存有效期（毫秒）
gateway.cache-ttl-millis=2000
# 上游调用超时（毫秒）
gateway.upstream-timeout-millis=500
# 单个热点 key 的最大并发请求数，超出直接拒绝（429）
gateway.max-concurrent-per-key=8
# 模拟上游延迟（毫秒），本地复现慢上游
gateway.simulated-latency-millis=50
# 模拟上游故障开关
gateway.simulated-failure=false

# 缓存过期后的宽限窗口（毫秒）：窗口内返回旧值(STALE_REFRESHING)并触发一次后台更新
gateway.stale-grace-millis=3000
# 宽限窗口内后台更新允许的最大连续失败次数，超过后落回兜底分类
gateway.stale-max-refresh-failures=3
# 全局同时压向上游的最大并发数
gateway.global-max-concurrent=32
# 全局排队容量（等待中的请求数上限），超出立即拒绝（QUEUE_FULL）
gateway.global-queue-capacity=64
# 全局排队最长等待时间（毫秒），超时拒绝（QUEUE_TIMEOUT）
gateway.global-queue-timeout-millis=200
# 熔断阈值：连续失败/超时达到该次数后进入保护期
gateway.circuit-failure-threshold=5
# 熔断保护期（毫秒）：期间不访问上游，直接走兜底
gateway.circuit-open-millis=5000
# 试探期允许同时放行的试探请求数
gateway.circuit-probe-count=2
