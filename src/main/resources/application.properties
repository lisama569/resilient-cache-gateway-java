spring.application.name=resilient-cache-gateway

# 缓存有效期（毫秒）
gateway.cache-ttl-millis=2000
# 上游调用超时（毫秒）
gateway.upstream-timeout-millis=500
# 单个热点 key 的最大并发请求数，超出直接拒绝（429）
gateway.max-concurrent-per-key=8
# 模拟上游延迟（毫秒），本地复现慢上游
gateway.simulated-latency-millis=50
# 模拟上游故障开关
gateway.simulated-failure=false

# 过期后的宽限窗口（毫秒）：窗口内返回旧结果并触发一次后台更新；0 表示关闭
gateway.swr-grace-millis=0
# 宽限窗口内后台更新连续失败上限，达到后落回同步兜底
gateway.swr-max-background-failures=3
# 全局同时回源的最大并发数
gateway.max-concurrent-upstream=16
# 全局容量满时排队等待的最长时间（毫秒）
gateway.queue-wait-timeout-millis=200
# 全局等待队列长度上限，超出即总量超限拒绝
gateway.max-queue-size=64
# 熔断器：连续失败达到该次数进入保护期
gateway.circuit-failure-threshold=5
# 熔断器：保护期时长（毫秒）
gateway.circuit-open-millis=5000
# 熔断器：试探期允许同时放行的试探请求数
gateway.circuit-half-open-probes=1
