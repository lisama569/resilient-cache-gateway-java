# ===== 弹性缓存网关配置（前缀 gateway.*）=====

# 缓存新鲜有效期（毫秒）：期内命中直接返回 FRESH，不触发上游
gateway.ttl-millis=5000
# 过期兜底窗口（毫秒）：过期后该窗口内上游不可用时可返回 STALE_FALLBACK
gateway.stale-ttl-millis=10000
# 单次上游调用硬超时（毫秒）
gateway.upstream-timeout-millis=800
# 单个热点目标允许参与合并的最大并发请求数（含实际加载者），超出立即 429
gateway.per-key-max-concurrent=10
# 全局同时进行的上游调用上限，超出返回 GLOBAL_OVERLOADED
gateway.global-max-concurrent=200
# 排队等待他人合并结果的最长时间（毫秒），超时返回 QUEUE_TIMEOUT
gateway.acquire-timeout-millis=100
# 熔断器连续失败阈值
gateway.failure-threshold=5
# 熔断打开持续时间（毫秒），之后进入半开试探
gateway.open-state-millis=2000
# 半开状态允许的试探调用数
gateway.half-open-permits=1
# 上游异常时是否允许使用过期数据兜底
gateway.stale-on-failure-enabled=true
# 执行上游调用的线程池大小
gateway.upstream-pool-size=200

# ===== 模拟上游初始配置（运行期可用 /admin/simulation/{target} 调整）=====
# 所有目标的默认模拟延迟
gateway.upstream.default-delay-millis=100
# 标记为 slow 的目标使用的延迟（需大于 upstream-timeout-millis 才能复现超时）
gateway.upstream.slow-delay-millis=3000
# 单独为目标配置延迟：gateway.upstream.delays.foo=150
# 启动即故障的目标：gateway.upstream.failing-keys[0]=broken
# 启动即慢调用的目标：gateway.upstream.slow-keys[0]=sluggish

server.port=8080
